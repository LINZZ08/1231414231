<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高速公路广告牌管理系统 - 统计看板</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .quick-links {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .quick-link-item {
      display: flex;
      align-items: center;
      padding: 16px;
      background: #f5faff;
      border: 1px solid #e6f4ff;
      border-radius: 6px;
      text-decoration: none;
      color: #333;
      transition: all 0.3s;
    }

    .quick-link-item:hover {
      background: #e6f4ff;
      border-color: #1890ff;
      transform: translateY(-2px);
    }

    .quick-link-item .icon {
      width: 40px;
      height: 40px;
      background: #1890ff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      margin-right: 12px;
    }

    .quick-link-item .link-text {
      font-size: 14px;
    }

    .quick-link-item .link-desc {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }

    .bar-chart {
      margin-top: 12px;
    }

    .bar-item {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .bar-item .bar-label {
      width: 120px;
      font-size: 13px;
      color: #666;
    }

    .bar-item .bar-track {
      flex: 1;
      height: 20px;
      background: #f0f0f0;
      border-radius: 10px;
      overflow: hidden;
      margin: 0 12px;
    }

    .bar-item .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #1890ff, #40a9ff);
      border-radius: 10px;
      transition: width 0.6s;
    }

    .bar-item .bar-value {
      width: 40px;
      font-size: 13px;
      color: #333;
      text-align: right;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">广告牌管理系统</div>
    <nav>
      <ul>
        <li><a href="dashboard.html" class="active">📊 统计看板</a></li>
        <li><a href="billboards.html">📍 广告牌列表</a></li>
        <li><a href="#">👥 客户管理</a></li>
        <li><a href="#">📄 合同管理</a></li>
        <li><a href="#">⚙️ 系统设置</a></li>
      </ul>
    </nav>
  </aside>

  <main class="main-content">
    <header class="header">
      <h1>统计看板</h1>
      <div class="user-info">欢迎回来，admin | <a href="login.html" style="color:#999;text-decoration:none;">退出</a></div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="number" id="stat-total">90</div>
        <div class="label">广告牌总数</div>
      </div>
      <div class="stat-card active">
        <div class="number" id="stat-active">58</div>
        <div class="label">在租中</div>
      </div>
      <div class="stat-card pending">
        <div class="number" id="stat-pending">22</div>
        <div class="label">待租</div>
      </div>
      <div class="stat-card maintenance">
        <div class="number" id="stat-maintenance">10</div>
        <div class="label">维修中</div>
      </div>
    </div>

    <div class="card detail-grid">
      <div class="detail-section">
        <h3>状态分布（饼图）</h3>
        <div class="pie-chart-container">
          <svg class="pie-chart" viewBox="0 0 200 200" id="pieSvg"></svg>
          <div class="pie-legend" id="pieLegend"></div>
        </div>
      </div>
      <div class="detail-section">
        <h3>快速入口</h3>
        <div class="quick-links">
          <a href="billboards.html" class="quick-link-item">
            <div class="icon">📍</div>
            <div>
              <div class="link-text">广告牌列表</div>
              <div class="link-desc">查看所有广告牌</div>
            </div>
          </a>
          <a href="billboards.html" class="quick-link-item">
            <div class="icon">➕</div>
            <div>
              <div class="link-text">新增广告牌</div>
              <div class="link-desc">录入新广告牌</div>
            </div>
          </a>
          <a href="#" class="quick-link-item">
            <div class="icon">📈</div>
            <div>
              <div class="link-text">租赁报表</div>
              <div class="link-desc">导出数据报告</div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:16px;color:#333;">各高速路段广告牌数量</h3>
      <div class="bar-chart" id="barChart"></div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script>
    (function() {
      var s = DASHBOARD_STATS;
      document.getElementById('stat-total').textContent = s.total;
      document.getElementById('stat-active').textContent = s.active;
      document.getElementById('stat-pending').textContent = s.pending;
      document.getElementById('stat-maintenance').textContent = s.maintenance;

      var pieData = [
        { label: '在租', value: s.active, color: '#52c41a' },
        { label: '待租', value: s.pending, color: '#faad14' },
        { label: '维修', value: s.maintenance, color: '#ff4d4f' }
      ];

      var svg = document.getElementById('pieSvg');
      var total = pieData.reduce(function(a, b) { return a + b.value; }, 0);
      var cx = 100, cy = 100, r = 80;
      var startAngle = -Math.PI / 2;

      pieData.forEach(function(item) {
        var sliceAngle = (item.value / total) * 2 * Math.PI;
        var endAngle = startAngle + sliceAngle;

        var x1 = cx + r * Math.cos(startAngle);
        var y1 = cy + r * Math.sin(startAngle);
        var x2 = cx + r * Math.cos(endAngle);
        var y2 = cy + r * Math.sin(endAngle);

        var largeArc = sliceAngle > Math.PI ? 1 : 0;
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        var d = 'M ' + cx + ' ' + cy + ' L ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2 + ' Z';
        path.setAttribute('d', d);
        path.setAttribute('fill', item.color);
        svg.appendChild(path);

        startAngle = endAngle;
      });

      svg.innerHTML += '<text x="100" y="95" text-anchor="middle" font-size="14" fill="#666">总计</text>' +
                      '<text x="100" y="115" text-anchor="middle" font-size="22" font-weight="bold" fill="#1890ff">' + total + '</text>';

      var legend = document.getElementById('pieLegend');
      pieData.forEach(function(item) {
        var pct = ((item.value / total) * 100).toFixed(1);
        var div = document.createElement('div');
        div.className = 'pie-legend-item';
        div.innerHTML = '<span class="color-dot" style="background:' + item.color + '"></span>' +
                        '<span class="legend-label">' + item.label + '</span>' +
                        '<span class="legend-value">' + item.value + ' (' + pct + '%)</span>';
        legend.appendChild(div);
      });

      var barContainer = document.getElementById('barChart');
      var maxCount = Math.max.apply(null, s.highways.map(function(h) { return h.count; }));
      s.highways.forEach(function(h) {
        var widthPct = (h.count / maxCount) * 100;
        var div = document.createElement('div');
        div.className = 'bar-item';
        div.innerHTML = '<span class="bar-label">' + h.name + '</span>' +
                       '<div class="bar-track"><div class="bar-fill" style="width:' + widthPct + '%;"></div></div>' +
                       '<span class="bar-value">' + h.count + '</span>';
        barContainer.appendChild(div);
      });
    })();
  </script>
</body>
</html>
