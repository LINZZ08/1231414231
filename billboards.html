<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高速公路广告牌管理系统 - 广告牌列表</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .toolbar select,
    .toolbar input {
      min-width: 120px;
    }

    .toolbar input[type="text"] {
      min-width: 200px;
    }

    .actions-cell {
      white-space: nowrap;
    }

    .actions-cell a {
      color: #1890ff;
      text-decoration: none;
      font-size: 13px;
      margin-right: 12px;
    }

    .actions-cell a:hover {
      text-decoration: underline;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .result-count {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">广告牌管理系统</div>
    <nav>
      <ul>
        <li><a href="dashboard.html">📊 统计看板</a></li>
        <li><a href="billboards.html" class="active">📍 广告牌列表</a></li>
        <li><a href="#">👥 客户管理</a></li>
        <li><a href="#">📄 合同管理</a></li>
        <li><a href="#">⚙️ 系统设置</a></li>
      </ul>
    </nav>
  </aside>

  <main class="main-content">
    <header class="header">
      <h1>广告牌列表</h1>
      <div class="user-info">欢迎回来，admin | <a href="login.html" style="color:#999;text-decoration:none;">退出</a></div>
    </header>

    <div class="card">
      <div class="toolbar">
        <div class="filters">
          <label style="font-size:14px;color:#666;">状态：</label>
          <select id="statusFilter" onchange="renderTable()">
            <option value="">全部</option>
            <option value="在租">在租</option>
            <option value="待租">待租</option>
            <option value="维修">维修</option>
          </select>

          <label style="font-size:14px;color:#666;">高速：</label>
          <select id="highwayFilter" onchange="renderTable()">
            <option value="">全部</option>
            <option value="G15">G15 沈海高速</option>
            <option value="G2">G2 京沪高速</option>
            <option value="G4">G4 京港澳高速</option>
          </select>

          <input type="text" id="searchInput" placeholder="搜索关键词..." oninput="renderTable()">
        </div>

        <div>
          <span class="result-count" id="resultCount">共 0 条记录</span>
          <button class="btn" onclick="alert('新增功能（实验演示用）')">+ 新增广告牌</button>
        </div>
      </div>

      <table id="billboardTable">
        <thead>
          <tr>
            <th>编号</th>
            <th>广告牌名称</th>
            <th>位置</th>
            <th>规格</th>
            <th>方向</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script>
    function getStatusTag(status) {
      var cls = 'status-tag ';
      if (status === '在租') cls += 'status-active';
      else if (status === '待租') cls += 'status-pending';
      else if (status === '维修') cls += 'status-maintenance';
      else cls += 'status-offline';
      return '<span class="' + cls + '">' + status + '</span>';
    }

    function renderTable() {
      var status = document.getElementById('statusFilter').value;
      var highway = document.getElementById('highwayFilter').value;
      var keyword = document.getElementById('searchInput').value.trim().toLowerCase();

      var filtered = BILLBOARDS.filter(function(item) {
        if (status && item.status !== status) return false;
        if (highway && item.highway !== highway) return false;
        if (keyword) {
          var hay = (item.name + item.location + item.city + item.highway + item.owner).toLowerCase();
          if (hay.indexOf(keyword) === -1) return false;
        }
        return true;
      });

      document.getElementById('resultCount').textContent = '共 ' + filtered.length + ' 条记录';

      var tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📭</div>没有找到匹配的记录</div></td></tr>';
        return;
      }

      filtered.forEach(function(item) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>#' + String(item.id).padStart(4, '0') + '</td>' +
          '<td style="font-weight:500;">' + item.name + '</td>' +
          '<td style="color:#666;">' + item.location + '</td>' +
          '<td>' + item.size + '</td>' +
          '<td>' + item.direction + '</td>' +
          '<td>' + getStatusTag(item.status) + '</td>' +
          '<td class="actions-cell">' +
            '<a href="detail.html?id=' + item.id + '">查看详情</a>' +
            '<a href="detail.html?id=' + item.id + '">编辑</a>' +
          '</td>';
        tbody.appendChild(tr);
      });
    }

    renderTable();
  </script>
</body>
</html>
